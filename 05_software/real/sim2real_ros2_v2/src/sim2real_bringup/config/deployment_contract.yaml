# =============================================================================
# 部署契约参考文件（仅供参考，C++ 代码不读取此文件）
# =============================================================================
#
# ⚠️ 注意：所有部署参数（电机映射、动作缩放、默认姿态等）均硬编码在
#   sim2real_common/include/sim2real_common/deployment_contract.hpp 中。
#   本 YAML 文件仅作为可读参考，修改此文件不会影响运行时行为！
#   如需修改部署参数，请同步更新 .hpp 文件和本文件。
#
# =============================================================================

model:
  path: "policies/model_rough.onnx"
  source_pt: "policies/model_rough.pt"
  backend: "onnxruntime"
  obs_dim: 53
  action_dim: 16
  clip_obs: 100.0

observation:
  terms:
    - {name: base_ang_vel, dim: 3, scale: 0.25}
    - {name: projected_gravity, dim: 3}
    - {name: command, dim: 3}
    - {name: joint_pos_rel, dim: 12}
    - {name: joint_vel_rel, dim: 12, scale: 0.05}
    - {name: wheel_vel, dim: 4, scale: 0.05}
    - {name: last_actions, dim: 16}

action:
  joint_order:
    - fl_hip_abduction
    - fl_hip_pitch
    - fl_knee
    - fr_hip_abduction
    - fr_hip_pitch
    - fr_knee
    - rl_hip_abduction
    - rl_hip_pitch
    - rl_knee
    - rr_hip_abduction
    - rr_hip_pitch
    - rr_knee
    - fl_wheel
    - fr_wheel
    - rl_wheel
    - rr_wheel
  wheel_indices: [12, 13, 14, 15]
  scale: [0.125, 0.25, 0.25, 0.125, 0.25, 0.25, 0.125, 0.25, 0.25, 0.125, 0.25, 0.25, 5.0, 5.0, 5.0, 5.0]
  default_dof_pos: [0.0, 0.9, -1.8, 0.0, 0.9, -1.8, 0.0, 0.9, -1.8, 0.0, 0.9, -1.8, 0.0, 0.0, 0.0, 0.0]

motor_mapping:
  can_id_map:
    fl_hip_abduction: [1, 1]
    fl_hip_pitch: [1, 2]
    fl_knee: [1, 3]
    fl_wheel: [1, 4]
    fr_hip_abduction: [1, 5]
    fr_hip_pitch: [1, 6]
    fr_knee: [1, 7]
    fr_wheel: [1, 8]
    rl_hip_abduction: [2, 1]
    rl_hip_pitch: [2, 2]
    rl_knee: [2, 3]
    rl_wheel: [2, 4]
    rr_hip_abduction: [2, 5]
    rr_hip_pitch: [2, 6]
    rr_knee: [2, 7]
    rr_wheel: [2, 8]
  direction_map:
    fl_hip_abduction: -1
    fl_hip_pitch: -1
    fl_knee: -1
    fl_wheel: -1
    fr_hip_abduction: -1
    fr_hip_pitch: 1
    fr_knee: 1
    fr_wheel: 1
    rl_hip_abduction: 1
    rl_hip_pitch: -1
    rl_knee: -1
    rl_wheel: -1
    rr_hip_abduction: 1
    rr_hip_pitch: 1
    rr_knee: 1
    rr_wheel: 1
  zero_offset_map:
    fl_hip_abduction: 0.003
    fl_hip_pitch: 0.030
    fl_knee: 0.028
    fl_wheel: 0.0
    fr_hip_abduction: 0.004
    fr_hip_pitch: 0.038
    fr_knee: 0.011
    fr_wheel: 0.0
    rl_hip_abduction: 0.019
    rl_hip_pitch: -0.034
    rl_knee: 0.025
    rl_wheel: 0.0
    rr_hip_abduction: -0.001
    rr_hip_pitch: 0.039
    rr_knee: 0.018
    rr_wheel: 0.0
